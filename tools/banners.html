<!doctype html>
<!--
  banners.html — the Infinite Flight Community thread graphics.

  One page, one banner at a time: ?b=header, or ?b=<section id> from SECTIONS
  below. tools/make-banners.js screenshots each into banners/*.png.

  Everything is the site's own: the palette from brand.css, Fraunces / Karla /
  JetBrains Mono, the Caballero Águila and the ruled device painted through
  their masks. Edit copy here, re-run the
  script, re-upload.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMV Thread Banners</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..100,0..1&family=Karla:wght@400..800&family=JetBrains+Mono:wght@400..700&display=block">
<link rel="stylesheet" href="../assets/brand.css">
<style>
    html, body { margin: 0; background: var(--am-navy); }
    body { width: var(--w); height: var(--h); overflow: hidden; }

    .bn-banner {
        position: relative; width: var(--w); height: var(--h); overflow: hidden;
        background: var(--am-wash); color: #fff;
        font-family: var(--font-body);
    }
    /* A soft pool of the section's colour behind the type. */
    .bn-banner::before {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(60% 120% at 18% 50%, color-mix(in srgb, var(--hue) 22%, transparent), transparent 70%);
    }

    /* The ruled device, flush right, red to rosa — as in the livery. */
    .bn-stripes {
        position: absolute; top: 0; right: 0; bottom: 0; width: 34%;
        background: linear-gradient(180deg, var(--am-red), var(--am-rosa));
        -webkit-mask: url('../assets/img/stripes.svg') no-repeat right center / 100% 100%;
                mask: url('../assets/img/stripes.svg') no-repeat right center / 100% 100%;
        opacity: .9;
    }
    .bn-mark {
        position: absolute; background: #fff; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center;
        -webkit-mask-image: url('../assets/img/mark.svg');
                mask-image: url('../assets/img/mark.svg');
    }

    /* The tail: a swept fin rising out of the bottom edge, livery navy with
       the eagle on it, standing in front of the stripes. The eagle sits in
       percentages of the fin's own box so it scales with either banner. */
    .bn-tail {
        position: absolute; right: 3%; bottom: 0; height: 100%; aspect-ratio: 600 / 560;
        filter: drop-shadow(-18px 0 40px rgba(4, 12, 28, .55));
    }
    .bn-tail svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bn-tail .bn-mark {
        left: 33%; top: 37%; width: 46%; aspect-ratio: 2778 / 2118;
        -webkit-mask-size: contain; mask-size: contain;
    }

    /* Greca along the foot, fading out before it reaches the tail. The fade
       is on a wrapper because the greca's own mask is already its shape. */
    .bn-foot {
        position: absolute; left: 0; bottom: 0; width: 58%; height: 24px;
        -webkit-mask: linear-gradient(90deg, #000 70%, transparent);
                mask: linear-gradient(90deg, #000 70%, transparent);
    }
    .bn-greca {
        position: absolute; inset: 0;
        background: var(--hue);
        -webkit-mask: url('../assets/img/greca.svg') repeat-x left center / auto 100%;
                mask: url('../assets/img/greca.svg') repeat-x left center / auto 100%;
    }

    .bn-copy { position: absolute; left: 96px; top: 50%; transform: translateY(-54%); max-width: 62%; }
    .bn-eyebrow {
        font-family: var(--font-mono); font-size: 22px; letter-spacing: .22em;
        text-transform: uppercase; color: var(--am-blue-300); margin: 0 0 18px;
    }
    .bn-eyebrow b { color: color-mix(in srgb, var(--hue) 70%, #fff); font-weight: 700; }
    h1 {
        font-family: var(--font-display); font-weight: 700; margin: 0; line-height: .95;
        font-variation-settings: 'opsz' 144, 'SOFT' 50, 'WONK' 1; letter-spacing: -.02em;
    }
    .bn-sub { font-size: 30px; line-height: 1.3; color: rgba(255,255,255,.82); margin: 20px 0 0; }
    .bn-en {
        font-family: var(--font-mono); font-size: 26px; letter-spacing: .22em;
        text-transform: uppercase; color: color-mix(in srgb, var(--hue) 70%, #fff); margin: 22px 0 0;
    }

    /* ---- header ---- */
    .is-header h1 { font-size: 124px; }

    /* ---- section divider ---- */
    .is-section h1 { font-size: 112px; }
</style>
</head>
<body>
<script src="../assets/js/data.js"></script>
<script>
(function () {
    const D = window.AMV_DATA, A = D.airline;

    /* Each section: the Spanish title leads, the English sits under it. */
    const SECTIONS = [
        { id: 'about',   es: 'Quiénes somos', en: 'About',       hue: 'var(--am-jade)' },
        { id: 'fleet',   es: 'Flota',         en: 'Fleet',       hue: 'var(--am-cobalt)' },
        { id: 'network', es: 'Red de rutas',  en: 'Network',     hue: 'var(--am-turquoise)' },
        { id: 'ranks',   es: 'Rangos',        en: 'Ranks',       hue: 'var(--am-marigold)' },
        { id: 'events',  es: 'Eventos',       en: 'Events',      hue: 'var(--am-rosa)' },
        { id: 'staff',   es: 'Equipo',        en: 'Staff',       hue: 'var(--am-clay)' },
        { id: 'join',    es: 'Únete',         en: 'How to Join', hue: 'var(--am-red)' },
    ];
    window.AMV_BANNERS = ['header', ...SECTIONS.map((s) => s.id)];

    /* Fin outline in a 600 x 560 box: leading edge swept back from the root,
       a short rounded tip, trailing edge swept back to the rudder. */
    const FIN = 'M40 560 L318 46 Q330 24 354 24 L498 24 Q518 24 516 44 L468 560 Z';
    const tail = `<div class="bn-tail">
        <svg viewBox="0 0 600 560" aria-hidden="true">
            <defs>
                <linearGradient id="fin" x1="0" y1="0" x2=".7" y2="1">
                    <stop offset="0" stop-color="#1A4C9E"/><stop offset=".45" stop-color="#0C2C64"/><stop offset="1" stop-color="#081630"/>
                </linearGradient>
                <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/>
                </linearGradient>
                <clipPath id="finclip"><path d="${FIN}"/></clipPath>
            </defs>
            <path d="${FIN}" fill="url(#fin)"/>
            <g clip-path="url(#finclip)">
                <rect width="600" height="560" fill="url(#sheen)"/>
                <path d="M494 110 L462 560" stroke="#fff" stroke-opacity=".14" stroke-width="3" fill="none"/>
            </g>
            <path d="M40 560 L318 46 Q330 24 354 24" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none"/>
        </svg>
        <div class="bn-mark"></div>
    </div>`;
    const foot = '<div class="bn-foot"><div class="bn-greca"></div></div>';

    const id = new URLSearchParams(location.search).get('b') || 'header';
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const root = document.documentElement;
    let html;

    if (id === 'header') {
        root.style.cssText = '--w:1600px;--h:560px;--hue:var(--am-marigold)';
        html = `<div class="bn-banner is-header">
            <div class="bn-stripes"></div>${tail}
            <div class="bn-copy">
                <p class="bn-eyebrow">${esc(A.platform)} · <b>${esc(A.server)}</b> · ${esc(A.alliance)}</p>
                <h1>${esc(A.name)}</h1>
                <p class="bn-sub">Mexico’s flag carrier, flown properly. Callsign ${esc(A.callsign)}.</p>
            </div>
            ${foot}</div>`;
    } else {
        const s = SECTIONS.find((x) => x.id === id);
        if (!s) throw new Error('unknown banner ' + id);
        root.style.cssText = `--w:1600px;--h:360px;--hue:${s.hue}`;
        html = `<div class="bn-banner is-section">
            <div class="bn-stripes"></div>${tail}
            <div class="bn-copy">
                <h1>${esc(s.es)}</h1>
                <p class="bn-en">${esc(s.en)}</p>
            </div>
            ${foot}</div>`;
    }
    document.body.innerHTML += html;
})();
</script>
</body>
</html>
