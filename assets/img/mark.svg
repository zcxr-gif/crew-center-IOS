<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aeromexico Virtual — the Caballero Águila mark.

  Original geometry: an eagle-warrior head in profile facing right, under a
  backswept feather plume. Drawn from scratch (no traced or lifted artwork) so
  the VA owns what it ships.

  Three shapes carry the raptor read, and none of them is optional:
    · the brow ridge overhanging the eye,
    · the beak as a distinct wedge with a deep DOWNWARD hook,
    · the cut gape line under the eye.
  Lose any one and it turns into a generic snouted animal. The plume sweeps
  back and stays short on purpose — tall vertical feathers read as ears, and a
  long plume goes to noise at favicon size.

  Uses `currentColor` throughout, so a single fill on the parent recolours it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Aeromexico Virtual">
  <title>Aeromexico Virtual</title>

  <!-- Feather plume, swept back behind the skull. -->
  <g fill="currentColor">
    <path d="M54 52C42 52 28 50 15 47C28 55 41 60 53 62Z" opacity=".5"/>
    <path d="M52 44C40 41 27 35 16 28C27 39 39 47 51 54Z" opacity=".72"/>
    <path d="M54 37C46 30 38 21 32 12C36 24 43 33 52 42Z" opacity=".95"/>
  </g>

  <!-- Head, hooked beak, eye and gape. Counter-forms punched with evenodd. -->
  <path fill="currentColor" fill-rule="evenodd" d="M32 54C36 38 50 32 63 36C73 39 79 43 81 50L110 60C113 67 110 78 102 80C100 72 95 68 86 65C84 75 77 82 66 86L56 95L40 89C32 79 30 65 32 54ZM67 56a5.5 5.5 0 1 0 .1 0zM83 62L99 66L97 70L82 67Z"/>
</svg>
