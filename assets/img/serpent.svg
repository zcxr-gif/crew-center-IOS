<?xml version="1.0" encoding="UTF-8"?>
<!--
  serpent.svg — Quetzalcóatl, the feathered serpent, in profile facing right.

  Aeroméxico's Quetzalcóatl 787-9 (XA-ADL) carries a serpent head drawn across
  the nose. This is our own answer to that idea — original geometry, drawn from
  scratch. It is not traced from the aircraft and does not reproduce the
  artwork on it.

  MONOCHROME ON PURPOSE — brand.css loads it as a CSS mask (`.serpent`) for the
  hero watermark, so it takes whatever colour the section needs. The hero used
  to have a dot-grid here; a dot-grid is from nowhere, and this is not.

  FILLED, NOT STROKED, and that is the whole lesson of drawing it. Earlier
  passes drew the head as 5px line-art with fangs and a forked tongue, and at
  the 8% opacity a watermark actually runs at, fine lines dissolve and the
  detail collapses into a scribble. Solid masses survive. So: four shapes and
  no more — plumes, upper jaw, lower jaw, and the eye punched out of the skull
  with fill-rule="evenodd", exactly how mark.svg builds the eagle warrior, so
  the two marks sit together as one hand.

  What has to survive a redraw: the snout hooking UP and back on itself (the
  single most Quetzalcóatl thing in the drawing), the gape held open as a clear
  wedge between two separate jaw masses, and the plumes swept back at stepped
  opacity. Close the gape or straighten the snout and it turns into a bird.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -20 300 200" width="300" height="200">

  <!-- Quetzal crest, three plumes swept back off the skull. -->
  <g fill="currentColor">
    <path d="M82 52C60 34 40 12 30-10 34 18 50 42 76 62Z" opacity=".95"/>
    <path d="M76 62C50 50 24 34 4 12 16 40 40 60 70 74Z" opacity=".78"/>
    <path d="M74 76C46 74 20 66-2 50 14 74 42 86 70 88Z" opacity=".6"/>
  </g>

  <!-- Skull and upper jaw, snout hooking up and back. Eye punched through. -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M70 66C86 40 140 34 176 58c14 9 28 16 40 26 12-10 22-24 16-34-6-9-22-6-24 6-1 8 6 14 14 12l-22 12c-28 12-82 18-130 6Z
           M116 76a12 12 0 1 0-24 0 12 12 0 1 0 24 0Z"/>

  <!-- Fangs, hung in the gape off each jaw. -->
  <g fill="currentColor">
    <path d="M120 92l4 15 10-13Z"/>
    <path d="M154 88l4 15 10-14Z"/>
    <path d="M140 141l3-15 11 12Z"/>
  </g>

  <!-- Lower jaw, tucked under the skull at the hinge, tip curling up. -->
  <path fill="currentColor"
        d="M74 100c34 28 72 42 102 46 10 2 14 12 10 20-5 9-18 10-24 2-4-6-1-13 5-14-32-2-72-14-104-42Z"/>
</svg>
